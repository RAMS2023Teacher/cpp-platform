id: autonomy-challenge
title: Autonomy Challenge
tagline: The season finale. One program, no driver, and points at every checkpoint
minutes: 120         # about three class periods: Part 1 plan and build in the simulator, Part 2 practice, then official runs on the real course

mission:
  big_question: "How do sensing, deciding and acting work together to finish a mission?"
  goal: |
    This is the season finale in Circuit City Arena: the **Collection Run**. With **no driver**, your robot
    leaves the start box, follows the black line, stops before the wall, collects a block and parks in the
    zone. Every **checkpoint** earns points, even if the full run fails. You'll **break the mission into
    functions**, test each one in the simulator, then make **three official runs**.
  picture:
    type: flow
    steps:
      - {icon: "🚦", label: "Leave the start box: 5", color: "#f5a623"}
      - {icon: "🛤️", label: "Follow the line to the end: 10", color: "#e5484d"}
      - {icon: "🧱", label: "Stop before the wall: 10", color: "#2f6bff"}
      - {icon: "📦", label: "Collect the block: 15", color: "#9b51e0"}
      - {icon: "🅿️", label: "Park in the zone: 10", color: "#33c95a"}
    caption: Five checkpoints, 50 points. You keep every checkpoint you reach.
  you_need:
    - Your team and your chassis (Color Sensor, Distance Sensor, Touch LED)
    - Your line follower from Follow the Line
    - "Optional, from the bins: a pusher for the front, to hold the block"
    - The Collection Run course (your teacher will show you)
    - A USB cable for the Brain
    - A stopwatch or the Brain's timer
  learn:
    - "**decompose**: break a big mission into small jobs"
    - "write the plan first, then code and test **one function at a time**"
    - "**sense → decide → act**, with every sensor working together"
    - "improve like an engineer: test, change **one** thing, test again"
  talk: Think of a big job you have done, like cooking a meal or cleaning a room. How did you break it into smaller jobs? Why is that easier than doing it all at once?

build:
  - part: "Part 1: Plan and build in the simulator"
    title: Know the course
    say: |
      Read the course before you write any code. The robot starts in the **start box**. After someone presses
      start, it's **hands off**. The course has five **checkpoints**. You score each one the robot reaches,
      so a run that fails halfway still earns points. Your best official run out of three is your arena score.
    do:
      - "**Left the start box on its own:** 5 points."
      - "**Followed the line to the end:** 10 points."
      - "**Stopped before the wall:** 10 points."
      - "**Collected the block:** 15 points. **Parked in the zone:** 10 points."
      - "**Rules:** one program. No controller. If you touch the robot, the run ends and you keep the points earned so far."
      - Walk to the real course with your team. Push your robot through it by hand, with the power off.
    test:
      - I can point to where each of the five checkpoints is on the course
      - My team pushed the robot through the course by hand
    ask: Which sensor helps with the line, and which with the wall? Which checkpoints have no sensor to help, and what could go wrong there?

  - part: "Part 1: Plan and build in the simulator"
    title: Plan before you code
    say: |
      Big programs start as a **plan**. Engineers **decompose**: they break the mission into small jobs and
      give each job a function. At first each function is a **stub**. A stub has the right name but only
      prints a message. That lets you test the **order** of the plan before any hard code exists.
    do:
      - "Read the plan in the comments at the top. Then read the three stubs."
      - "In `main()`, call the three functions in the order of the plan."
      - Press **Run**. The Brain should print the three stages in order.
    code: |
      // MISSION PLAN
      // 1. Follow the black line until the wall is close.
      // 2. Turn right and drive into the parking zone.
      // 3. Stop, turn the LED green, print the time.

      void followLineToWall() {
        Brain.Screen.print("1 line");
        Brain.Screen.newLine();
      }

      void park() {
        Brain.Screen.print("2 park");
        Brain.Screen.newLine();
      }

      void finish() {
        Brain.Screen.print("3 finish");
        Brain.Screen.newLine();
      }

      int main() {
        followLineToWall();
        park();
        finish();
      }
    new: "22-24"
    what: "`main()` is now the whole mission in three lines. The robot doesn't move yet, and that's fine. You'll replace one stub at a time with real code."
    stuck:
      - "**Nothing prints?** `main()` must call the functions. A call looks like `park();`"
      - "**The order is wrong?** Calls run top to bottom, like every other statement."
    sim:
      starter: |
        // MISSION PLAN
        // 1. Follow the black line until the wall is close.
        // 2. Turn right and drive into the parking zone.
        // 3. Stop, turn the LED green, print the time.

        void followLineToWall() {
          Brain.Screen.print("1 line");
          Brain.Screen.newLine();
        }

        void park() {
          Brain.Screen.print("2 park");
          Brain.Screen.newLine();
        }

        void finish() {
          Brain.Screen.print("3 finish");
          Brain.Screen.newLine();
        }

        int main() {
          // TODO: call the three functions in the order of the plan

        }
      field:
        start: {x: 14, y: 62, heading: 0}
        lines: [{points: [[14, 66], [14, 36], [20, 24], [32, 16], [88, 16]], width: 2}]
        cubes: [{x: 78, y: 30, color: blue}]
        zones: [{x: 64, y: 36, w: 28, h: 28, color: blue}]
        goal: {x: 78, y: 50, r: 12}
      checks:
        - {type: output, pattern: "1 line[\\s\\S]*2 park[\\s\\S]*3 finish", message: "The Brain prints the three stages in order"}
        - {type: code, pattern: "int\\s+main\\s*\\(\\s*\\)\\s*\\{[\\s\\S]*followLineToWall\\s*\\(\\s*\\)\\s*;[\\s\\S]*park\\s*\\(\\s*\\)\\s*;[\\s\\S]*finish\\s*\\(\\s*\\)\\s*;", message: "main() calls all three functions"}
      solution: |
        // MISSION PLAN
        // 1. Follow the black line until the wall is close.
        // 2. Turn right and drive into the parking zone.
        // 3. Stop, turn the LED green, print the time.

        void followLineToWall() {
          Brain.Screen.print("1 line");
          Brain.Screen.newLine();
        }

        void park() {
          Brain.Screen.print("2 park");
          Brain.Screen.newLine();
        }

        void finish() {
          Brain.Screen.print("3 finish");
          Brain.Screen.newLine();
        }

        int main() {
          followLineToWall();
          park();
          finish();
        }
    ask: Why write stubs that only print, before writing the real code? What can you check with them?

  - part: "Part 1: Plan and build in the simulator"
    title: "Stage 1: line to the wall"
    say: |
      Replace the first stub with real code. You already own the hard part: `onLine()` and `followLine()`
      from Follow the Line. **Reusing** tested functions is what they are for. `followLineToWall()` just
      calls `followLine()` again and again until the Distance Sensor says the wall is 12 inches away.
    do:
      - "Add `threshold`, `onLine()` and `followLine()` above `followLineToWall()`."
      - "Replace the body of `followLineToWall()` with the `while` loop."
      - Press **Run**. The robot should follow the line and stop by itself in the green goal. The other two stubs still just print.
    code: |
      int threshold = 50;

      bool onLine() {
        return Color.brightness() < threshold;
      }

      void followLine() {
        if (onLine()) {
          Drivetrain.turnFor(left, 5, degrees);
        } else {
          Drivetrain.turnFor(right, 5, degrees);
        }
        Drivetrain.driveFor(forward, 1, inches);
      }

      void followLineToWall() {
        while (Distance.distance(inches) > 12) {
          followLine();
        }
      }
    new: "1-14, 17-19"
    what: "Two sensors work together here. The **Color Sensor** steers every step. The **Distance Sensor** decides when the stage is over."
    tip: "**Watch out:** functions must be written **above** the code that calls them. Keep this order: `onLine`, `followLine`, `followLineToWall`, then the rest."
    stuck:
      - "**onLine was not declared?** It must be above `followLine()`, with the same spelling."
      - "**The robot spins?** Dark turns **left**, light turns **right**."
      - "**It hits the wall?** The loop must stop while the wall is still far: `> 12`."
    sim:
      carry: true
      starter: |
        // MISSION PLAN
        // 1. Follow the black line until the wall is close.
        // 2. Turn right and drive into the parking zone.
        // 3. Stop, turn the LED green, print the time.

        int threshold = 50;

        // TODO: add onLine() and followLine() from Follow the Line here

        void followLineToWall() {
          // TODO: while the wall is more than 12 inches away, followLine()

        }

        void park() {
          Brain.Screen.print("2 park");
          Brain.Screen.newLine();
        }

        void finish() {
          Brain.Screen.print("3 finish");
          Brain.Screen.newLine();
        }

        int main() {
          followLineToWall();
          park();
          finish();
        }
      field:
        start: {x: 14, y: 62, heading: 0}
        lines: [{points: [[14, 66], [14, 36], [20, 24], [32, 16], [88, 16]], width: 2}]
        cubes: [{x: 78, y: 30, color: blue}]
        zones: [{x: 64, y: 36, w: 28, h: 28, color: blue}]
        goal: {x: 78, y: 16, r: 8}
      checks:
        - {type: goal, message: "Stage 1: the robot follows the line and stops before the wall"}
        - {type: noCollision, message: "The robot never touches a wall"}
        - {type: code, pattern: "void\\s+followLineToWall\\s*\\(\\s*\\)\\s*\\{[^}]*Distance\\.distance", message: "followLineToWall() uses the Distance Sensor"}
      solution: |
