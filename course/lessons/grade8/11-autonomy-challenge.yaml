        }

        void park() {
          Brain.Screen.print("2 park");
          Brain.Screen.newLine();
        }

        void finish() {
          Brain.Screen.print("3 finish");
          Brain.Screen.newLine();
        }

        int main() {
          followLineToWall();
          park();
          finish();
        }
    ask: You didn't rewrite the line follower. You reused it. What is one more job on this course that could become its own function?

  - part: "Part 1: Plan and build in the simulator"
    title: "Stage 2: turn and park"
    say: |
      Test one stage **alone**. Here the robot starts where Stage 1 ended, facing the wall. To skip Stage 1
      for now, turn its call into a **comment** with `//`. Then write `park()`: turn right 90 degrees and
      drive into the zone. The block is on the way. Push it along: that is how you **collect** it.
    do:
      - "In `main()`, put `//` in front of `followLineToWall();`."
      - "Replace the body of `park()` with a right turn and a drive of about 32 inches."
      - Press **Run**. The robot should stop inside the green goal in the parking zone.
      - Change the distance and run again. Find the shortest and longest drives that still park.
    code: |
      void park() {
        Drivetrain.turnFor(right, 90, degrees);
        Drivetrain.driveFor(forward, 32, inches);
      }

      void finish() {
        Brain.Screen.print("3 finish");
        Brain.Screen.newLine();
      }

      int main() {
        // followLineToWall();
        park();
        finish();
      }
    new: "2-3, 12"
    what: "Commenting out a call is how programmers test one piece at a time. Nothing is deleted. You'll bring the line back in the next step."
    tip: "**Watch out:** this stage has **no sensor**. It trusts the turn and the distance. On the real robot this is the stage most likely to drift, so aim for the **middle** of the zone."
    stuck:
      - "**The robot turns the wrong way?** The zone is on the robot's right."
      - "**It stops short or drives through the zone?** Change the 32 a few inches at a time."
    sim:
      carry: true
      starter: |
        int threshold = 50;

        bool onLine() {
          return Color.brightness() < threshold;
        }

        void followLine() {
          if (onLine()) {
            Drivetrain.turnFor(left, 5, degrees);
          } else {
