    fields: ["Shortest drive that parks (in)", "Longest drive that parks (in)"]
    ask: Why is it smart to aim for the middle of the zone, not the nearest edge, on a real robot?

  - part: "Part 1: Plan and build in the simulator"
    title: The full run
    say: |
      Put it all together. Bring Stage 1 back, write `finish()`, and time the run. `Brain.Timer.clear()` sets
      the Brain's stopwatch to zero. `Brain.Timer.time(seconds)` reads it. The Touch LED shows **red** while
      the robot works and **green** when the mission is done.
    do:
      - "Replace the body of `finish()` with the highlighted lines."
      - "In `main()`, remove the `//` so Stage 1 runs again. Add the timer and the red LED at the top."
      - Press **Run** and keep your hands off. This is the whole mission, and the block should end in the zone.
      - Run it three times. Is the time the same every time?
    code: |
      void finish() {
        Drivetrain.stop();
        TouchLED.setColor(green);
        Brain.Screen.print("Time: %.1f s", Brain.Timer.time(seconds));
      }

      int main() {
        Brain.Timer.clear();
        TouchLED.setColor(red);
        followLineToWall();
        park();
        finish();
      }
    new: "2-4, 8-10"
    what: "`%.1f` prints the time with one decimal place. Every trip around the line loop is **sense → decide → act**. The whole program is the same idea, one stage after another."
    stuck:
      - "**The robot turns right at the start?** `followLineToWall();` is still commented out. Remove the `//`."
      - "**No time on the screen?** Check the print line has `%.1f` inside the quotes and the timer after the comma."
      - "**It parks outside the goal, or loses the block?** Go back and check the wall distance (12), the turn (90) and the drive (about 32)."
    sim:
      carry: true
      starter: |
        int threshold = 50;

        bool onLine() {
          return Color.brightness() < threshold;
        }

        void followLine() {
          if (onLine()) {
            Drivetrain.turnFor(left, 5, degrees);
          } else {
            Drivetrain.turnFor(right, 5, degrees);
          }
          Drivetrain.driveFor(forward, 1, inches);
        }

        void followLineToWall() {
          while (Distance.distance(inches) > 12) {
            followLine();
          }
        }

        void park() {
          Drivetrain.turnFor(right, 90, degrees);
          Drivetrain.driveFor(forward, 32, inches);
        }

        void finish() {
          // TODO: stop, turn the Touch LED green, print "Time: " and the timer in seconds

        }

        int main() {
          // TODO: clear the timer and turn the Touch LED red
          // followLineToWall();   // TODO: bring Stage 1 back
          park();
          finish();
        }
      field:
        start: {x: 14, y: 62, heading: 0}
        lines: [{points: [[14, 66], [14, 36], [20, 24], [32, 16], [88, 16]], width: 2}]
        cubes: [{x: 78, y: 30, color: blue}]
        zones: [{x: 64, y: 36, w: 28, h: 28, color: blue}]
        goal: {x: 78, y: 50, r: 12}
      checks:
        - {type: goal, message: "The robot finishes parked inside the zone"}
        - {type: noCollision, message: "The robot never touches a wall"}
        - {type: output, pattern: "Time:\\s*\\d", message: "The Brain prints the time"}
        - {type: cubesInZones, message: "The block is collected: it ends in the zone"}
      solution: |
        int threshold = 50;

        bool onLine() {
          return Color.brightness() < threshold;
        }

        void followLine() {
          if (onLine()) {
            Drivetrain.turnFor(left, 5, degrees);
          } else {
            Drivetrain.turnFor(right, 5, degrees);
          }
          Drivetrain.driveFor(forward, 1, inches);
        }

