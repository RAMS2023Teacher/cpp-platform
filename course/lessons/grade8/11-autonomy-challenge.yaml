    fields: ["Simulator time (s)"]
    ask: The simulator gives the same time on every run. Will your real robot? Name two things that could change a real run.

  - part: "Part 2: Official runs on the real course"
    title: Get the real robot ready
    say: |
      The simulator proved your **plan**. The real course will test your **numbers**. Three of them came from
      the simulator and are probably wrong on the real field: the **threshold**, the **wall distance** and the
      **parking drive**. Measure before you run.
    do:
      - "Calibrate as you did in Follow the Line: read the Color Sensor over the floor and over the tape. Put the middle number in `threshold`."
      - Measure from the end of the line to the middle of the parking zone with a ruler. Use that for the drive in `park()`.
      - Go back one step to **The full run**. Press **Copy for VEXcode**, then **Copy code**. Paste it into VEXcode over `int main()` and everything below it.
      - "Type in your real numbers. Check **Devices** lists the Drivetrain, `Color`, `Distance` and `TouchLED`. Download."
    stuck:
      - "**Lots of errors after pasting?** You pasted over the folded device block. Press Ctrl + Z and paste lower."
      - "**A sensor was not declared?** Its name in Devices must match the code exactly."
    test:
      - My real threshold is in the program
      - My parking drive comes from a ruler, not from the simulator
      - The program is downloaded to the Brain
    fields: ["Floor reading", "Tape reading", "My threshold", "Parking drive (in)"]

  - part: "Part 2: Official runs on the real course"
    title: Practice one checkpoint at a time
    say: |
      Don't practice the whole course yet. Work **one checkpoint at a time**, in order, and bank each one.
      When a checkpoint works **two times in a row**, move on. Change **one** number between tries, so you
      know what fixed it. Running out of time? A robot that reaches three checkpoints every time beats one
      that reaches five once.
    do:
      - "**Leave the box, follow the line:** run from the start box. Does it reach the end of the line?"
      - "**Stop before the wall:** does it stop by itself, without touching?"
      - "**Collect and park:** comment out `followLineToWall();`, put the robot at the end of the line, and run. Does the block end in the zone with the robot?"
      - Remove the `//`, download, and make one full practice run.
    stuck:
      - "**It never leaves the box?** Check the program started and the sensor is at the tape's left edge. Leaving the box alone is 5 points."
      - "**The block slides away?** Add a wide, flat pusher from the bins to the front, or change where the robot stops at the wall."
      - "**It loses the line?** Recalibrate the threshold, or start with the sensor right at the tape's left edge."
      - "**It bumps the wall?** Stop sooner: make the 12 bigger."
      - "**It misses the zone?** Check the robot's angle when it stops at the wall. Then fix the turn before the drive."
      - "**It doesn't stop at the wall?** Check the Distance Sensor points straight ahead and its cable is in."
    test:
      - The robot reached the end of the line two times in a row
      - It stopped before the wall two times in a row
      - We practiced collecting the block and parking
      - We made one full practice run
    fields: ["Checkpoints we can reach every time"]
    ask: Which checkpoint was the least reliable in practice, and what do you think causes it?

  - part: "Part 2: Official runs on the real course"
    title: Official run 1
    say: |
      Time for the first official run. One teammate places the robot in the start box and presses start.
      After that it's **hands off** for everyone. A second teammate keeps score. A third watches the wall
      and the block. Whatever happens, write it down. A run that fails still earns its checkpoints and
      still gives you data.
    do:
      - Place the robot in the start box. Put the block back on its mark.
      - Press start and step back.
      - "Score it: left the start box on its own **5**, followed the line to the end **10**, stopped before the wall **10**."
      - "Then: collected the block **15**, parked in the zone **10**. Add up the checkpoints the robot reached."
      - Read the time from the Brain screen. If the robot didn't finish, write DNF.
    test:
      - Nobody touched the robot after pressing start
      - We scored the run with the teacher or another team watching
    fields: ["Checkpoints reached", "Time (s)", "Total points"]
    ask: Where did the run lose points or time? Describe exactly what the robot did there.

  - part: "Part 2: Official runs on the real course"
    title: Fix one thing, then run 2
    say: |
      Engineers don't change five things and hope. They pick the **one** problem that cost the most, make
      **one** change, and test again. That way the next run tells you if the change worked. If run 1 was
      perfect, make one change to make it more **reliable**.
    do:
      - "As a team, agree on the one problem to fix. Find the function it lives in."
      - Make one change. Test that stage alone if there's time.
      - Make official run 2, with the same rules, and score it.
    test:
      - We changed only one thing between runs
      - We scored run 2
    fields: ["The one thing we changed", "Checkpoints reached", "Time (s)", "Total points"]
    ask: Did your one change make run 2 better, worse, or the same? How do you know it was that change?

  - part: "Part 2: Official runs on the real course"
    title: Run 3 and showcase
    say: |
      Last run. Make one more change, or leave the program alone if it is reliable. Then look back.
      You started this season turning two gears by hand. Then came a chassis, code, a controller and
      sensors, and now a robot that runs a mission alone. All of it was **sense → decide → act**.
    do:
      - Make official run 3 and score it. Your **best** run is your **arena score**.
      - Write your arena score down and give it to your teacher. They enter it on the site for the final **Circuit City Arena standings**.
      - "Showcase: tell the class your best score, the one fix that helped most, and one thing you would add with another week."
      - Shake hands with the other teams. Take off your add-ons and sensors if your teacher asks, and sort them back into the bins.
    test:
      - We scored run 3
      - We gave our arena score to our teacher
      - We shared our best run and our best fix with the class
    fields: ["Run 3 total points", "Run 3 time (s)", "Our arena score (best of three)"]
    ask: Pick one earlier lesson, from gears to sensors. How did what you learned there show up in your robot today?

quiz:
  - question: What does it mean to decompose a mission?
    choices: ["Delete the parts that don't work", "Break it into smaller jobs you can build and test one at a time", "Run it as fast as possible", "Write the whole program before testing anything"]
    answer: 1
    why: Small jobs are easier to write, test and fix. Each job on the course became its own function.
  - question: "The Distance Sensor reads 30, then 18, then 11 on three checks in a row. How many times does `followLine()` run?\n\n`while (Distance.distance(inches) > 12) {`\n\n`  followLine();`\n\n`}`"
    choices: ["0 times", "1 time", "2 times", "3 times"]
    answer: 2
    why: "30 > 12 is true, so it runs. 18 > 12 is true, so it runs again. 11 > 12 is false, so the loop ends. That's 2 times."
  - question: "`main()` calls `followLineToWall();` then `park();` then `finish();`. The robot loses the line and never sees the wall. What happens?"
    choices: ["It skips to `park()`", "It stays inside `followLineToWall()` and never reaches `park()`", "It runs `finish()` first", "The Brain restarts the program"]
    answer: 1
    why: Statements run in order. The next call can't start until the loop inside `followLineToWall()` ends.
  - question: Why did you test `park()` with the line-following call commented out?
    choices: ["To make the program shorter forever", "To test one stage alone, so a problem can only come from that stage", "Because comments make the robot faster", "Because two functions can't be in one program"]
    answer: 1
    why: Testing one piece at a time tells you exactly where a bug lives. You brought the call back for the full run.
  - question: Run 1 scored 25 points. Why change only ONE thing before run 2?
    choices: ["The rules of C++ only allow one change", "So you know which change caused the new result", "Because downloading takes too long", "So the other teams can't copy you"]
    answer: 1
    why: If you change several things and the run gets better or worse, you can't tell which change did it.

ship:
  turn_in: code
  note: Your full-run program from the simulator is turned in with your run scores, your arena score and your answers.
  extensions:
    - title: Stage lights
      level: Easier
      goal: Show which stage the robot is in. Blue while it follows the line, yellow while it parks, green when it's done.
      where: The first line inside `followLineToWall()` and the first line inside `park()`.
      code: |
        void park() {
          TouchLED.setColor(yellow);
          Drivetrain.turnFor(right, 90, degrees);
          Drivetrain.driveFor(forward, 32, inches);
        }
      new: "2"
      hints:
        - "Do the same in `followLineToWall()` with `blue`."
        - "On the real course the colors tell you which function is running when something goes wrong."
    - title: Park with a sensor
      level: Medium
      goal: "Stage 3 trusts a measured drive. Make it sense instead: after the turn, drive in small steps until the Distance Sensor sees the far wall at the right distance."
      where: "Inside `park()`, in place of the long `driveFor`."
      code: |
        void park() {
          Drivetrain.turnFor(right, 90, degrees);
          while (Distance.distance(inches) > 18) {
            Drivetrain.driveFor(forward, 1, inches);
          }
        }
      new: "3-5"
      hints:
        - "In the simulator, 18 inches from the far wall is inside the zone. On the real course, measure from the middle of the zone to the wall."
        - "Which is more reliable on your real robot: counting inches or sensing the wall? Test both."
    - title: Never lose the block
      level: Challenge
      goal: Earn the block points on every run. Make the block finish inside the zone three times in a row on the real course.
      where: "Tune `followLineToWall()` and `park()`, and the front of your robot."
      hints:
        - "The block slides off if the robot hits it off-center. Change where the robot stops at the wall, 1 inch at a time, until the block is dead ahead after the turn."
        - "The robot's angle at the wall changes from run to run. After the turn, `Gyro.heading()` should be close to 180. Print it to check."
        - "A wide flat pusher on the front holds the block better than a narrow one. A claw from the bins holds it best, but it needs a motor and more code."
  reflect:
    - Look back over the season, from your first gear tester to today. Which idea helped you most in the challenge, and where did you first learn it?
    - If you had one more week, what is the first thing you would change on your robot or in your program, and why?

teacher_notes: |
  **Pacing (three periods).** Day 1: Mission, then Part 1 (steps 1-5) in the simulator. Day 2: steps 6-7, calibrate,
  download and practice one checkpoint at a time on the real course. Day 3: three rounds of official runs (steps 8-10),
  the showcase, the quiz and Ship it. If you only have two periods, do steps 6-7 in the second half of Day 1 for
  teams that are ready, and cut to two official runs.

  **Keeping it achievable.** This challenge is built so that a partial run still scores. The five checkpoints are in
  course order, and a team keeps every one its robot reaches. Tell teams on Day 2 to bank checkpoints in order and
  not to chase the full run until the first three are reliable. A team whose line follower is not working can
  still earn the first 5 points with a single `Drivetrain.driveFor(forward, 14, inches);` out of the box, then
  add the line. A team that reaches the wall every time has 25 points before it touches the block.

  **Scoring (Circuit City Arena, "Collection Run").** The lesson uses the scoring guide as it is on the site:

  - Left the start box on its own: **5**
  - Followed the line to the end: **10**
  - Stopped before the wall: **10**
  - Collected the block: **15**
  - Parked in the zone: **10**

  Maximum **50**. The best of three official runs is the team's arena score. Students record each run in steps 8-10
  and hand you the best one. You type the scores on the class page, and the site ranks them and updates the season
  standings on the class display. A touch by a student ends the run; points earned so far stay. Have a neutral
  scorer (you or another team) confirm each official run. The time on the Brain is not part of the score; use it
  only if you want a tie-breaker, and say so before the first run.

  **Decide and announce before Day 2.** What "collected the block" means in your room. In the simulator the robot
  pushes the block into the zone, and the lesson teaches that. You could also accept a block held in a claw. What
  "parked" means (for example, the whole robot inside the zone tape). What "stopped before the wall" means if the
  robot stops but then nudges the wall during the turn.

  **Taping the course (before Day 1).** The lesson does not give students any course sizes; they are told you will
  show them. The simulator field is the model, and the sizes below are a suggestion taken from it. Change them to
  fit your room.

  - **Start box:** a 12 inch square in one corner. Mark it with corner marks or light-colored masking tape, **not** black
    tape, or the Color Sensor will read the box as a line.
  - **Line:** black electrical tape, two strips side by side (about 1.5 inches wide). About 26 inches straight out of
    the start box, one gentle bend to the right (two 30-45° kinks, no sharp corner), then a long straight run **square
    to a field wall**, ending about 8 inches from it. The robot starts with its sensor at the line's **left** edge.
  - **Parking zone:** a tape box about 28 × 28 inches (any color), on the **right** of the line's end. Its near edge
    is about 20 inches from the line. Keep it at least 6 inches from the walls.
  - **Block:** one cube or block on a tape mark between the line's end and the zone, about 14 inches from the line.
  - Check that nothing else stands in front of the line's last straight run, or the Distance Sensor will stop early.

  **Check on a real robot:**
  - Run the course yourself once with the lesson's solution and your own calibration, so you know the wall distance
    (12 inches in the simulator) and parking drive that work on your field.
  - That each chassis pushes the block straight. A wide flat pusher on the front helps; the 2WD Lite may need one most.
  - That the Color Sensor, Distance Sensor and Touch LED all fit on each chassis at once, and which ports are free.
  - That the block is heavy enough not to roll away, and light enough for every chassis to push.

  **Running the event.** Call teams to the course in a fixed order, one official run each per round. While waiting,
  teams make their one change and test that stage on a spare strip of tape or in the simulator. With one course and
  many teams, cap each turn at 90 seconds.

  **Common trouble.** Threshold not recalibrated for the challenge course or for today's light. The robot's angle at
  the wall varies by a few degrees, so the parking drive drifts: aim for the middle of the zone, or use the "Park with
  a sensor" extension. `followLineToWall();` left commented out after stage practice. The Distance Sensor pointing
  down at the floor or blocked by the Color Sensor mount. Low batteries changing the turns between runs. On shared
  robots, sensors moved or unplugged by another class: have teams check ports and recalibrate at the start of each day.

  **Grading.** The turned-in program shows decomposition (three stage functions and a short `main()`). The run
  records and the "one thing we changed" field show the iteration. Weigh those at least as much as the best score.

  **Simulator note.** The simulator's last step checks that the robot parks, never touches a wall, prints a time and
  that the block ends in the zone. With the lesson's numbers the block stays in front of the robot. A team that
  changes the wall distance may see the block slide off; the fix is the same as on the real robot.
standards:
  - code: 6-8.CS.a.5
    how: Teams design and demonstrate a robot that runs a five-checkpoint course with no driver, in three scored runs.
  - code: 6-8.CS.a.4
    how: Students use the Color Sensor, Distance Sensor, timer, motors and Touch LED together and explain which sensor ends each stage.
  - code: 6-8.CT.b.3
    how: Students decompose the mission into followLineToWall(), park() and finish(), first as stubs, then build and test each one.
  - code: 6-8.CT.d.2
    how: Each stage is a function, so main() is a five-line plan that hides the detail.
  - code: 6-8.CT.d.4
    how: The program uses while loops, if / else, comparison expressions, a threshold variable and functions that call other functions.
  - code: 6-8.CT.d.6
    how: Students test one stage at a time, then change exactly one thing between official runs and record whether it helped.
  - code: 6-8.CT.d.3
    how: The team writes one program that implements the whole mission and reaches the goal in the simulator and on the real course.
