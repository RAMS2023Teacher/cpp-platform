<!doctype html>
<html lang="en" data-theme="eco">
<head>
<meta charset="utf-8">
<script>
  // Collect script errors so they can be shown on the page (many school devices block developer tools).
  window.__loadErrors = []; window.__loaded = [];
  window.addEventListener('error', function (e) { window.__loadErrors.push((e.message || 'Unknown error') + (e.lineno ? ' (page line ' + e.lineno + ', column ' + e.colno + ')' : '')); });
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoboCode Academy</title>
<meta name="description" content="Learn C++, algorithms and AI with VEX IQ robots — a course for 8th graders.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Cousine:wght@400;700&family=Audiowide&family=Space+Grotesk:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/codemirror/lib/codemirror.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<a class="skip" href="#app">Skip to main content</a>
<header class="topbar">
  <a class="brand" href="#/"><span class="logo">🤖</span><span><b>RoboCode</b><span class="brand-more"> Academy</span></span></a>
  <nav id="nav"></nav>
  <button class="theme-btn" id="reading" type="button" aria-expanded="false" aria-controls="reading-panel">Aa Reading</button>
  <button class="theme-btn" id="theme" type="button"></button>
  <div class="clock" id="clock"></div>
</header>
<main>
  <div class="win-title"><span id="wintitle">RoboCode Academy</span><span class="ctl off" aria-hidden="true">_</span><span class="ctl off" aria-hidden="true">□</span><a class="ctl close" href="#/" title="Back to home" aria-label="Back to home">✕</a></div>
  <div id="app" tabindex="-1"><div class="loading">Loading…</div></div>
</main>
<form id="reading-panel" class="reading-panel" hidden aria-label="Reading options">
  <label class="f">Text size<select name="text"><option value="">Normal</option><option value="1">Large</option><option value="2">Extra large</option></select></label>
  <label class="row small"><input type="checkbox" name="spacing"> Extra space between lines and letters</label>
  <label class="row small"><input type="checkbox" name="font"> Simple, plain font</label>
</form>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/vendor/codemirror/lib/codemirror.js"></script>
<script src="/vendor/codemirror/mode/clike/clike.js"></script>
<script src="/vendor/codemirror/addon/edit/matchbrackets.js"></script>
<script src="/vendor/codemirror/addon/edit/closebrackets.js"></script>
<script src="/js/sim.js"></script>
<script src="/js/widgets.js"></script>
<script src="/js/visuals.js"></script>
<script src="/js/quest.js"></script>
<script src="/js/app.js"></script>
<script src="/js/desktop.js"></script>
<script>
  // If a part of the site failed to start, say so on screen with the browser's own error message.
  (function () {
    var parts = ['codemirror', 'sim.js', 'widgets.js', 'visuals.js', 'quest.js', 'app.js', 'desktop.js'];
    var missing = parts.filter(function (p) { return p === 'codemirror' ? !window.CodeMirror : (p === 'sim.js' ? !window.VexSim : false); });
    if (!missing.length && !window.__loadErrors.length) return;
    var box = document.createElement('div');
    box.setAttribute('role', 'alert');
    box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:60px;z-index:9999;background:#fde8e8;color:#5c1015;border:2px solid #d1343b;border-radius:12px;padding:12px 14px;font:14px/1.45 system-ui,sans-serif;max-height:40vh;overflow:auto';
    var esc = function (t) { return String(t).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };
    box.innerHTML = '<b>Part of RoboCode Academy did not start.</b> Please send this whole message to your teacher.' +
      (missing.length ? '<br>Not loaded: ' + esc(missing.join(', ')) : '') +
      '<br>Started: ' + esc((window.__loaded || []).join(', ') || 'none recorded') +
      '<br>Browser: ' + esc(navigator.userAgent) +
      (window.__loadErrors.length ? '<br>Errors:<br>• ' + window.__loadErrors.map(esc).join('<br>• ') : '<br>No error was reported.') +
      ' <button type="button" style="margin-left:8px">Hide</button>';
    box.querySelector('button').onclick = function () { box.remove(); };
    document.body.appendChild(box);
  })();
</script>
</body>
</html>
